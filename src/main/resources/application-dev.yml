# 应用服务 WEB 访问端口
server:
  ip : localhost
  port: 9090
spring:
  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${server.ip}:3306/wanwan?serverTimezone=GMT%2b8&allowMultiQueries=true
    username: root
    password: luoshujiang
    druid:
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456
        reset-enable: false

      web-stat-filter: #监控web
        url-pattern: /*
        exclusions: '*.png,/druid/*'
        enabled: true

      filters: stat,wall,slf4j  #底层开启功能，stat：sql监控，wall：防火墙
      filter:
        stat:
          slow-sql-millis: 1000
          log-slow-sql: true
          enabled: true
        wall:
          enabled: true
          config:
            drop-table-allow: false
      aop-patterns: com.example.day3.*
  mvc:
    pathmatch:
      # 整合swagger时报错解决
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1000MB
  redis:
    host: 127.0.0.1
    port: 6379
    password: luoshujiang
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
mybatis:
  #扫描所有xml文件
  mapper-locations: classpath:mapper/*.xml
#  configuration:
#    打印日志
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
files:
  upload:
    path: D:/IdeaProjects/小白做毕设2024/files/
jwt:
  signature: wanwan
  expire: 24
logging:
